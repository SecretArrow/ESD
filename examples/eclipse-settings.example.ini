; Eclipse SSH Desktop settings example (settings.ini lives in the OS config dir)
[appearance]
theme=system            ; system | light | dark
accent=#5B8DEF
density=1.0             ; 0.85 compact | 1.0 comfortable | 1.15 dense

[terminal]
fontFamily=monospace
fontSize=12
scrollback=10000
cursorStyle=block       ; block | beam | underline
cursorBlink=true

[connections]
autoReconnect=true
reconnectRetries=5
reconnectBaseInterval=1500

[transfers]
maxParallel=2

[fileManager]
confirmDelete=true
confirmOverwrite=true
showHidden=false

[security]
credentialStorage=os    ; os | session | ask

[ssh]
defaultEngine=auto      ; auto | libssh | libssh2

[behavior]
minimizeToTray=true

[advanced]
debugMode=false
updateChannel=stable
