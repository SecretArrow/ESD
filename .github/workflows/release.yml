name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache g++ pkg-config qmake6 \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite libgl1-mesa-dev \
            libssh-dev libssh2-1-dev libvterm-dev libssl-dev zlib1g-dev \
            qt6-serialport-dev \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-dialogs qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qt-labs-platform

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: |
          cmake -G Ninja -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DECLIPSE_WARNINGS_AS_ERRORS=OFF \
            -DECLIPSE_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/ci -j

      - name: Tests
        run: ctest --test-dir build/ci --output-on-failure

      - name: Debian package
        run: ECLIPSE_BUILD_DIR="$PWD/build/ci" bash packaging/debian/build-deb.sh

      - name: Portable archive
        run: ECLIPSE_BUILD_DIR="$PWD/build/ci" bash packaging/portable/make-portable.sh

      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          curl -sL -o /tmp/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sL -o /tmp/linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-qt
          export PATH="/tmp:$PATH"
          ECLIPSE_BUILD_DIR="$PWD/build/ci" bash packaging/appimage/build-appimage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.tar.xz
            dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows release package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: false
          release: false
          cache: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-5compat
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-libssh2
            mingw-w64-x86_64-libvterm
            mingw-w64-x86_64-qt6-serialport
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkgconf

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: 'C:/Users/runneradmin/AppData/Local/ccache'
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -G Ninja -B build/ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DECLIPSE_WARNINGS_AS_ERRORS=OFF \
            -DECLIPSE_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        shell: msys2 {0}
        run: cmake --build build/ci -j

      - name: Tests
        shell: msys2 {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/ci --output-on-failure

      - name: Deploy runtime (windeployqt + full DLL closure + verify)
        shell: msys2 {0}
        env:
          ECLIPSE_BUILD_DIR: build/ci
        run: bash packaging/windows/deploy-runtime.sh

      - name: Smoke launch (offscreen)
        shell: msys2 {0}
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen ECLIPSE_HEADLESS=1 ECLIPSE_LOG_STDERR=1 timeout -k 2 8 ./dist/win64/eclipse-ssh-desktop.exe > /tmp/smoke.log 2>&1
          RC=$?
          set -e
          echo "smoke exit code: $RC"
          cat /tmp/smoke.log || true
          echo "--- recent app logs ---"
          for V in "$APPDATA" "$LOCALAPPDATA"; do
            [ -n "$V" ] || continue
            D=$(cygpath -u "$V" 2>/dev/null || echo "$V")
            find "$D" -type f -name 'eclipse-ssh.log' -mmin -3 2>/dev/null | head -1 | xargs -r tail -5 || true
          done
          [ "$RC" -eq 124 ] || [ "$RC" -eq 0 ] || [ "$RC" -eq 137 ]
          if grep -qi "is not installed" /tmp/smoke.log; then echo "QML MODULE MISSING IN DIST"; exit 1; fi
          # QML health gate: zero runtime binding/reference errors allowed to ship
          if grep -nE "ReferenceError|is not defined|is not installed|Unable to assign|TypeError:|Style names must not contain paths|failed to load icon font|Cannot override FINAL" /tmp/smoke.log; then
            echo "FATAL: QML runtime errors in smoke log"; exit 1
          fi
           grep -q "Quick Controls style (post-load): EclipseMD3" /tmp/smoke.log || { echo "FATAL: EclipseMD3 style not active"; exit 1; }

      - name: Zip portable
        shell: msys2 {0}
        run: |
          cd dist
          if command -v 7z >/dev/null 2>&1; then
            7z a -tzip eclipse-ssh-desktop-windows-x86_64.zip win64
          else
            powershell.exe -NoProfile -Command "Compress-Archive -Path win64 -DestinationPath eclipse-ssh-desktop-windows-x86_64.zip -Force"
          fi


      - name: Smoke launch (real windows desktop, bundled QML only)
        shell: msys2 {0}
        run: |
          set +e
          unset QT_QPA_PLATFORM
          ECLIPSE_HEADLESS=1 timeout -k 2 12 ./dist/win64/eclipse-ssh-desktop.exe > /tmp/smoke-win.log 2>&1
          RC=$?
          set -e
          echo "real-platform smoke exit code: $RC"
          cat /tmp/smoke-win.log || true
          [ "$RC" -eq 124 ] || [ "$RC" -eq 0 ] || [ "$RC" -eq 137 ]
          grep -q "QML root" /tmp/smoke-win.log || { echo "APP NEVER REACHED QML LOAD"; exit 1; }
          if grep -qi "is not installed" /tmp/smoke-win.log; then
            echo "QML MODULES NOT IMPORTABLE FROM DIST (qt.conf/import path bug)"; exit 1
          fi
          if grep -nE "ReferenceError|is not defined|is not installed|Unable to assign|TypeError:|Style names must not contain paths|failed to load icon font|Cannot override FINAL" /tmp/smoke-win.log; then
            echo "FATAL: QML runtime errors in smoke log"; exit 1
          fi
           grep -q "Quick Controls style (post-load): EclipseMD3" /tmp/smoke-win.log || { echo "FATAL: EclipseMD3 style not active"; exit 1; }
          test -f ./dist/win64/qt.conf || { echo "qt.conf missing from dist"; exit 1; }

      - name: Single instance (2nd exits 0 and pokes 1st; 1st stays alive)
        shell: msys2 {0}
        run: |
          ECLIPSE_HEADLESS=1 ./dist/win64/eclipse-ssh-desktop.exe > /tmp/first.log 2>&1 &
          FIRST=$!
          sleep 6
          if ! kill -0 $FIRST 2>/dev/null; then echo "FIRST INSTANCE DIED"; cat /tmp/first.log; exit 1; fi
          grep -q "QML root" /tmp/first.log || { echo "FIRST INSTANCE NEVER REACHED QML LOAD"; cat /tmp/first.log; kill -9 $FIRST 2>/dev/null || true; exit 1; }
          set +e
          ECLIPSE_HEADLESS=1 timeout -k 2 10 ./dist/win64/eclipse-ssh-desktop.exe > /tmp/second.log 2>&1
          RC=$?
          set -e
          echo "second instance exit code: $RC"
          cat /tmp/second.log || true
          if [ "$RC" -ne 0 ]; then echo "SECOND INSTANCE DID NOT EXIT CLEANLY"; kill -9 $FIRST 2>/dev/null || true; exit 1; fi
          grep -q "already running" /tmp/second.log || { echo "MUTEX NOT DETECTED BY SECOND INSTANCE"; kill -9 $FIRST 2>/dev/null || true; exit 1; }
          if ! kill -0 $FIRST 2>/dev/null; then echo "FIRST INSTANCE DIED"; exit 1; fi
          kill -9 $FIRST 2>/dev/null || true
          echo "single-instance handshake OK"

      - name: CLI help via redirected stdout
        shell: msys2 {0}
        run: |
          set +e
          ./dist/win64/eclipse-ssh-desktop.exe --help > /tmp/help.log 2>&1
          RC=$?
          set -e
          echo "help exit code: $RC"
          head -8 /tmp/help.log
          [ "$RC" -eq 0 ] && grep -qi "eclipse" /tmp/help.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p rel
          find artifacts -type f \( -name '*.deb' -o -name '*.tar.xz' -o -name '*.zip' -o -name '*.AppImage' \) -exec cp {} rel/ \;
          ls -la rel/

      - name: Generate SHA256 checksums
        run: |
          cd rel
          sha256sum *.zip *.AppImage *.tar.xz *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: .github/release-body.md
          files: rel/*
