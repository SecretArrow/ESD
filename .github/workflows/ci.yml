name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux build + test + package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ECD_SSHD_HOST: 127.0.0.1
      ECD_SSHD_PORT: 2222
      ECD_SSHD_USER: runner
      ECD_SSHD_KEY: ${{ github.workspace }}/testkey
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache gcc pkg-config openssh-server \
            libgtk-4-dev libssh-dev libvterm-dev libssl-dev zlib1g-dev \
            xvfb file

      - name: Build (warnings are errors)
        run: |
          cmake -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci -j"$(nproc)"

      - name: Start local sshd (testbed)
        run: |
          ssh-keygen -t ed25519 -N '' -f "$GITHUB_WORKSPACE/testkey" -q
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          cp "$GITHUB_WORKSPACE/testkey.pub" "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo usermod -p '*' runner
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -D -p 2222 -o UsePAM=no -o PubkeyAuthentication=yes \
            -o AuthorizedKeysFile=.ssh/authorized_keys -o StrictModes=yes \
            -o Subsystem="sftp internal-sftp" > /tmp/sshd.log 2>&1 &
          sleep 2
          nc -z 127.0.0.1 2222 || { cat /tmp/sshd.log; exit 1; }

      - name: Unit tests
        run: ctest --test-dir build/ci -R unit --output-on-failure

      - name: SSH/SFTP round-trip tests
        run: ctest --test-dir build/ci -R ssh_roundtrip --output-on-failure

      - name: Sanitizer build + tests (ASan/UBSan)
        run: |
          cmake -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DECLIPSE_BUILD_UI=OFF -DECLIPSE_ASAN=ON
          cmake --build build/asan -j"$(nproc)"
          ctest --test-dir build/asan -R unit --output-on-failure
          # roundtrip exercises libssh/glib singletons whose one-time allocations
          # register as LSan noise; leak detection stays strict on the unit suite
          ASAN_OPTIONS=detect_leaks=0 ./build/asan/test_roundtrip

      - name: Smoke test GUI (offscreen)
        run: |
          xvfb-run -a ./build/ci/eclipse-ssh --help 2>/dev/null &
          APP_PID=$!
          sleep 6
          kill -0 $APP_PID 2>/dev/null && kill $APP_PID || true
          echo "GUI binary launches under Xvfb"

      - name: Package (tgz + deb)
        run: |
          cd build/ci && cpack -G TGZ && cpack -G DEB 2>/dev/null || true
          ls -la eclipse-ssh*.* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            build/ci/*.tar.gz
            build/ci/*.deb
          if-no-files-found: warn

  windows:
    name: Windows build (MSYS2 MinGW64)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git make ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libssh
            mingw-w64-x86_64-libvterm
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(cygpath -m /mingw64/lib/pkgconfig):$(cygpath -m /mingw64/share/pkgconfig)"
          cmake -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Release -DMS2_PREFIX="$(cygpath -m /mingw64)"
          cmake --build build/ci -j"$(nproc)"

      - name: Unit tests
        run: ./build/ci/test_unit

      - name: CLI smoke
        run: ./build/ci/eclipse-ssh-cli list
      - name: CLI smoke
        run: ./build/ci/eclipse-ssh-cli list

      - name: GUI smoke (real desktop)
        run: |
          set +e
          ECLIPSE_HEADLESS=1 timeout -k 2 40 ./build/ci/eclipse-ssh > /tmp/smoke-win.log 2>&1
          RC=$?
          set -e
          echo "smoke exit: $RC (124=timeout-kill, expected)"
          cat /tmp/smoke-win.log || true
          [ "$RC" -eq 124 ] || [ "$RC" -eq 0 ] || [ "$RC" -eq 137 ]
          if grep -nEi "GLib-GObject-ERROR|Gtk-ERROR|Segmentation" /tmp/smoke-win.log; then
            echo "FATAL: GUI crashed at startup"; exit 1
          fi
          echo "GUI smoke OK"

      - name: Package zip (portable)
        run: |
          mkdir -p dist/win64
          cp build/ci/eclipse-ssh.exe build/ci/eclipse-ssh-cli.exe dist/win64/ 2>/dev/null || true
          cd dist/win64
          ldd eclipse-ssh.exe 2>/dev/null | awk '/=> \/mingw64/{print $3}' | xargs -r -I{} cp -n {} . || true
          ldd eclipse-ssh-cli.exe 2>/dev/null | awk '/=> \/mingw64/{print $3}' | xargs -r -I{} cp -n {} . || true
          mkdir -p share/glib-2.0/schemas
          cp /mingw64/share/glib-2.0/schemas/gschemas.compiled share/glib-2.0/schemas/ 2>/dev/null || true
          # GTK4 requires its schemas + loaders; copy minimal trees
          cp -r /mingw64/lib/gtk-4.0 lib/ 2>/dev/null || true
          cd ..
          7z a eclipse-ssh-windows-x86_64.zip win64 > /dev/null || true
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/eclipse-ssh-windows-x86_64.zip
          if-no-files-found: warn
